<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171E2D"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(163,230,53,0.3)"/>
      <stop offset="100%" stop-color="rgba(114,221,247,0.2)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtle circular border -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(163,230,53,0.06)" stroke-width="1"/>
  <!-- Initials -->
  <text x="200" y="215" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="96" fill="#A3E635" letter-spacing="-2">SR</text>
</svg>
